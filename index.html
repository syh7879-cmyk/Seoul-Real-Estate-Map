<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대한민국 GIS 지도</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Malgun Gothic', sans-serif; display:flex; height:100vh; overflow:hidden; }
#map { flex:1; height:100%; }

#panel {
  width:310px; background:#fff;
  border-left:1px solid #e0e0e0;
  display:flex; flex-direction:column; overflow-y:auto;
}

.panel-section { padding:14px 16px; border-bottom:1px solid #f1f5f9; }
.panel-title {
  font-size:11px; font-weight:600; color:#94a3b8;
  text-transform:uppercase; letter-spacing:0.07em; margin-bottom:10px;
}

/* 레이어 버튼 */
.layer-btns { display:flex; gap:5px; flex-wrap:wrap; }
.layer-btn {
  font-size:11px; padding:4px 11px; border-radius:999px;
  border:1px solid #e2e8f0; background:#f8fafc; color:#64748b;
  cursor:pointer; font-family:'Malgun Gothic', sans-serif; transition:all 0.15s;
}
.layer-btn.on { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
.layer-btn.jijuk-on { background:#15803d; color:#fff; border-color:#15803d; }

/* 주소 카드 */
.addr-card { border:1px solid #e2e8f0; border-radius:10px; overflow:hidden; }
.addr-row {
  display:flex; align-items:flex-start; gap:8px;
  padding:9px 12px; border-bottom:1px solid #f1f5f9;
}
.addr-row:last-child { border-bottom:none; }
.addr-badge {
  font-size:10px; font-weight:600; padding:2px 7px;
  border-radius:999px; flex-shrink:0; margin-top:1px;
}
.badge-road   { background:#dbeafe; color:#1d4ed8; }
.badge-jibun  { background:#dcfce7; color:#15803d; }
.badge-region { background:#fef3c7; color:#b45309; }
.badge-zip    { background:#fee2e2; color:#b91c1c; }
.badge-coord  { background:#f3e8ff; color:#7e22ce; }
.addr-text { font-size:12px; color:#1e293b; line-height:1.6; word-break:keep-all; flex:1; }
.addr-text.muted { color:#94a3b8; font-style:italic; }

/* 측정 결과 */
.measure-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.measure-box {
  background:#f8fafc; border:1px solid #e2e8f0;
  border-radius:8px; padding:10px 12px;
}
.measure-label { font-size:10px; color:#94a3b8; margin-bottom:4px; }
.measure-value { font-size:14px; font-weight:600; color:#1e293b; line-height:1.4; }
.measure-sub   { font-size:11px; color:#64748b; margin-top:2px; }

/* 도형 목록 */
.shape-item {
  background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;
  padding:9px 12px; margin-bottom:6px;
  display:flex; align-items:center; gap:8px;
  cursor:pointer; transition:background 0.15s;
}
.shape-item:hover { background:#eff6ff; border-color:#bfdbfe; }
.shape-icon {
  width:26px; height:26px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; flex-shrink:0;
}
.icon-marker  { background:#fef3c7; }
.icon-line    { background:#dbeafe; }
.icon-polygon { background:#dcfce7; }
.shape-name { font-size:13px; font-weight:500; color:#1e293b; }
.shape-meta {
  font-size:11px; color:#64748b; margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.btn-delete {
  background:none; border:none; color:#cbd5e1;
  cursor:pointer; font-size:15px; padding:2px; line-height:1;
}
.btn-delete:hover { color:#ef4444; }
.empty-msg { text-align:center; color:#94a3b8; font-size:13px; padding:20px 0; line-height:1.8; }

/* 하단 팁 */
.tip {
  background:#eff6ff; border-left:3px solid #3b82f6;
  border-radius:4px; padding:10px 12px;
  font-size:12px; color:#1d4ed8; line-height:1.8;
}
.btn-clear {
  width:100%; padding:8px; border:1px solid #fecaca;
  border-radius:8px; background:#fff5f5; color:#dc2626;
  font-size:13px; cursor:pointer; font-family:'Malgun Gothic', sans-serif;
}
.btn-clear:hover { background:#fee2e2; }
</style>
</head>

<body>
<div id="map"></div>

<div id="panel">

  <!-- 레이어 선택 -->
  <div class="panel-section">
    <div class="panel-title">지도 레이어</div>
    <div class="layer-btns">
      <button class="layer-btn on"  id="btnBase"     onclick="switchBase('base')">일반지도</button>
      <button class="layer-btn"     id="btnSatellite" onclick="switchBase('satellite')">위성지도</button>
      <button class="layer-btn"     id="btnHybrid"    onclick="switchBase('hybrid')">하이브리드</button>
      <button class="layer-btn"     id="btnJijuk"     onclick="toggleJijuk()">지적도</button>
    </div>
  </div>

  <!-- 주소 조회 -->
  <div class="panel-section">
    <div class="panel-title">주소 조회</div>
    <div class="addr-card">
      <div class="addr-row">
        <span class="addr-badge badge-road">도로명</span>
        <span class="addr-text muted" id="addrRoad">지도를 클릭하세요</span>
      </div>
      <div class="addr-row">
        <span class="addr-badge badge-jibun">지번</span>
        <span class="addr-text muted" id="addrJibun">—</span>
      </div>
      <div class="addr-row">
        <span class="addr-badge badge-region">행정구역</span>
        <span class="addr-text muted" id="addrRegion">—</span>
      </div>
      <div class="addr-row">
        <span class="addr-badge badge-zip">우편번호</span>
        <span class="addr-text muted" id="addrZip">—</span>
      </div>
      <div class="addr-row">
        <span class="addr-badge badge-coord">좌표</span>
        <span class="addr-text muted" id="addrCoord">—</span>
      </div>
    </div>
  </div>

  <!-- 측정 결과 -->
  <div class="panel-section">
    <div class="panel-title">측정 결과</div>
    <div class="measure-grid">
      <div class="measure-box" style="grid-column:1/-1">
        <div class="measure-label">면적</div>
        <div class="measure-value" id="resultArea">—</div>
        <div class="measure-sub"  id="resultAreaPyeong"></div>
      </div>
      <div class="measure-box">
        <div class="measure-label">둘레 / 길이</div>
        <div class="measure-value" id="resultLength">—</div>
      </div>
      <div class="measure-box">
        <div class="measure-label">꼭짓점 수</div>
        <div class="measure-value" id="resultPoints">—</div>
      </div>
    </div>
  </div>

  <!-- 도형 목록 -->
  <div class="panel-section" style="flex:1">
    <div class="panel-title">그린 도형 목록</div>
    <div id="shapeList">
      <div class="empty-msg">왼쪽 지도에서<br>점·선·면을 그려보세요</div>
    </div>
  </div>

  <!-- 사용 팁 -->
  <div class="panel-section">
    <div class="tip">
      📍 <b>점</b> — 마커 클릭 후 지도 클릭<br>
      📏 <b>선</b> — 선 클릭 후 여러 점, 더블클릭 완료<br>
      ⬡ <b>면</b> — 다각형 클릭 후 꼭짓점, 첫 점으로 닫기<br>
      🗺 지적도 켜면 필지 경계 확인 가능
    </div>
  </div>

  <!-- 전체 삭제 -->
  <div class="panel-section">
    <button class="btn-clear" onclick="clearAll()">전체 도형 삭제</button>
  </div>

</div>

<script>
// ─────────────────────────────────────────────
// 0. VWorld API 키
// ─────────────────────────────────────────────
const VWORLD_KEY = 'D610EF82-D2E0-32E7-B2E7-FC49A7026C01';

// ─────────────────────────────────────────────
// 1. 지도 초기화 (서울 중심, 줌 12)
// ─────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([37.5665, 126.9780], 12);

// ─────────────────────────────────────────────
// 2. 타일 레이어 정의
// ─────────────────────────────────────────────

// ✅ 일반지도 — xdworld (API 키 불필요, 즉시 작동)
const layerBase = L.tileLayer(
  'https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png',
  { attribution: '© VWorld (국토지리정보원)', maxZoom: 19, minZoom: 6 }
);

// ✅ 위성지도 — api.vworld.kr
const layerSatellite = L.tileLayer(
  `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Satellite/{z}/{y}/{x}.jpeg`,
  { attribution: '© VWorld (국토지리정보원)', maxZoom: 19, minZoom: 6 }
);

// ✅ 하이브리드 레이블 — xdworld (위성 위에 도로명 표시)
const layerHybridLabel = L.tileLayer(
  'https://xdworld.vworld.kr/2d/Hybrid/service/{z}/{x}/{y}.png',
  { attribution: '© VWorld (국토지리정보원)', maxZoom: 19, minZoom: 6, opacity: 1 }
);

// ✅ 지적도 — VWorld WMS
const layerJijuk = L.tileLayer.wms(
  'https://api.vworld.kr/req/wms',
  {
    layers: 'LP_PA_CBND_BUBUN,LP_PA_CBND_JIBUN',
    format: 'image/png',
    transparent: true,
    version: '1.3.0',
    crs: L.CRS.EPSG3857,
    attribution: '© VWorld 지적도',
    opacity: 0.6,
    key: VWORLD_KEY
  }
);

// ─────────────────────────────────────────────
// 3. 현재 활성 베이스 레이어 추적
// ─────────────────────────────────────────────
let currentBase = 'base';
let jijukOn = false;

// 초기 레이어 적용
layerBase.addTo(map);

// ─────────────────────────────────────────────
// 4. 레이어 전환 함수
// ─────────────────────────────────────────────
function switchBase(type) {
  // 기존 베이스/레이블 전부 제거
  [layerBase, layerSatellite, layerHybridLabel].forEach(l => {
    if (map.hasLayer(l)) map.removeLayer(l);
  });

  if (type === 'base') {
    layerBase.addTo(map);
  } else if (type === 'satellite') {
    layerSatellite.addTo(map);
  } else if (type === 'hybrid') {
    layerSatellite.addTo(map);
    layerHybridLabel.addTo(map);
  }

  // 지적도는 항상 최상단 유지
  if (jijukOn) {
    if (map.hasLayer(layerJijuk)) map.removeLayer(layerJijuk);
    layerJijuk.addTo(map);
  }

  currentBase = type;

  // 버튼 상태 갱신
  ['btnBase', 'btnSatellite', 'btnHybrid'].forEach(id => {
    document.getElementById(id).classList.remove('on');
  });
  const btnMap = { base:'btnBase', satellite:'btnSatellite', hybrid:'btnHybrid' };
  document.getElementById(btnMap[type]).classList.add('on');
}

// ─────────────────────────────────────────────
// 5. 지적도 토글
// ─────────────────────────────────────────────
function toggleJijuk() {
  jijukOn = !jijukOn;
  if (jijukOn) {
    layerJijuk.addTo(map);
    document.getElementById('btnJijuk').classList.add('jijuk-on');
  } else {
    if (map.hasLayer(layerJijuk)) map.removeLayer(layerJijuk);
    document.getElementById('btnJijuk').classList.remove('jijuk-on');
  }
}

// ─────────────────────────────────────────────
// 6. 그리기 도구 (leaflet-draw)
// ─────────────────────────────────────────────
const drawnItems = new L.FeatureGroup().addTo(map);

const drawControl = new L.Control.Draw({
  edit: { featureGroup: drawnItems },
  draw: {
    polygon:  { shapeOptions: { color:'#1d4ed8', fillOpacity:0.15 } },
    polyline: { shapeOptions: { color:'#0ea5e9' } },
    marker:   true,
    circle:   false,
    rectangle:false,
    circlemarker: false
  }
});
map.addControl(drawControl);

// ─────────────────────────────────────────────
// 7. 도형 등록 & 측정
// ─────────────────────────────────────────────
let shapeRegistry = [];
let shapeCount = { marker:0, polyline:0, polygon:0 };
let shapeIdSeq = 0;

map.on(L.Draw.Event.CREATED, function(e) {
  const layer = e.layer;
  const type  = e.layerType;
  drawnItems.addLayer(layer);
  shapeIdSeq++;

  const nameMap = { marker:'마커', polyline:'선', polygon:'면' };
  shapeCount[type]++;
  const name = `${nameMap[type] || type} ${shapeCount[type]}`;

  shapeRegistry.push({ id: shapeIdSeq, type, layer, name });
  updateMeasure(type, layer);
  renderShapeList();
});

map.on(L.Draw.Event.EDITED, function(e) {
  e.layers.eachLayer(layer => {
    const s = shapeRegistry.find(x => x.layer === layer);
    if (s) updateMeasure(s.type, s.layer);
  });
  renderShapeList();
});

map.on(L.Draw.Event.DELETED, function(e) {
  e.layers.eachLayer(layer => {
    const idx = shapeRegistry.findIndex(x => x.layer === layer);
    if (idx !== -1) shapeRegistry.splice(idx, 1);
  });
  renderShapeList();
});

// ─────────────────────────────────────────────
// 8. 측정값 계산 & 표시
// ─────────────────────────────────────────────
function updateMeasure(type, layer) {
  const areaEl   = document.getElementById('resultArea');
  const pyeongEl = document.getElementById('resultAreaPyeong');
  const lenEl    = document.getElementById('resultLength');
  const ptEl     = document.getElementById('resultPoints');

  if (type === 'polygon') {
    const coords = layer.getLatLngs()[0].map(ll => [ll.lng, ll.lat]);
    coords.push(coords[0]);
    const sqm = turf.area(turf.polygon([coords]));
    const pyeong = sqm / 3.305785;
    areaEl.textContent   = formatArea(sqm);
    pyeongEl.textContent = `약 ${pyeong.toFixed(1)} 평`;
    lenEl.textContent    = formatLength(turf.length(turf.lineString(coords), { units:'kilometers' }));
    ptEl.textContent     = `${coords.length - 1} 개`;

  } else if (type === 'polyline') {
    const coords = layer.getLatLngs().map(ll => [ll.lng, ll.lat]);
    areaEl.textContent   = '—';
    pyeongEl.textContent = '';
    lenEl.textContent    = formatLength(turf.length(turf.lineString(coords), { units:'kilometers' }));
    ptEl.textContent     = `${coords.length} 개`;

  } else if (type === 'marker') {
    const ll = layer.getLatLng();
    areaEl.textContent   = '—';
    pyeongEl.textContent = '';
    lenEl.textContent    = '—';
    ptEl.textContent     = `${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}`;
  }
}

// ─────────────────────────────────────────────
// 9. 도형 목록 렌더링
// ─────────────────────────────────────────────
function renderShapeList() {
  const el = document.getElementById('shapeList');
  if (shapeRegistry.length === 0) {
    el.innerHTML = '<div class="empty-msg">왼쪽 지도에서<br>점·선·면을 그려보세요</div>';
    return;
  }
  el.innerHTML = shapeRegistry.map(s => {
    const iconMap  = { marker:'📍', polyline:'📏', polygon:'⬡' };
    const classMap = { marker:'icon-marker', polyline:'icon-line', polygon:'icon-polygon' };
    return `
    <div class="shape-item" onclick="focusShape(${s.id})">
      <div class="shape-icon ${classMap[s.type]}">${iconMap[s.type]}</div>
      <div style="flex:1;min-width:0">
        <div class="shape-name">${s.name}</div>
        <div class="shape-meta">${getShapeMeta(s)}</div>
      </div>
      <button class="btn-delete" onclick="deleteShape(event,${s.id})">✕</button>
    </div>`;
  }).join('');
}

function getShapeMeta(s) {
  try {
    if (s.type === 'marker') {
      const ll = s.layer.getLatLng();
      return ll.lat.toFixed(4) + '° / ' + ll.lng.toFixed(4) + '°';
    } else if (s.type === 'polyline') {
      const coords = s.layer.getLatLngs().map(ll => [ll.lng, ll.lat]);
      return '길이 ' + formatLength(turf.length(turf.lineString(coords), { units:'kilometers' }));
    } else if (s.type === 'polygon') {
      const coords = s.layer.getLatLngs()[0].map(ll => [ll.lng, ll.lat]);
      coords.push(coords[0]);
      return '면적 ' + formatArea(turf.area(turf.polygon([coords])));
    }
  } catch(e) { return ''; }
}

function focusShape(id) {
  const s = shapeRegistry.find(x => x.id === id);
  if (!s) return;
  if (s.type === 'marker') map.setView(s.layer.getLatLng(), 17);
  else map.fitBounds(s.layer.getBounds(), { padding:[40,40] });
}

function deleteShape(event, id) {
  event.stopPropagation();
  const idx = shapeRegistry.findIndex(x => x.id === id);
  if (idx === -1) return;
  drawnItems.removeLayer(shapeRegistry[idx].layer);
  shapeRegistry.splice(idx, 1);
  renderShapeList();
}

function clearAll() {
  if (!confirm('모든 도형을 삭제할까요?')) return;
  drawnItems.clearLayers();
  shapeRegistry = [];
  shapeCount    = { marker:0, polyline:0, polygon:0 };
  document.getElementById('resultArea').textContent      = '—';
  document.getElementById('resultAreaPyeong').textContent = '';
  document.getElementById('resultLength').textContent    = '—';
  document.getElementById('resultPoints').textContent    = '—';
  ['addrRoad','addrJibun','addrRegion','addrZip','addrCoord'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = (id === 'addrRoad') ? '지도를 클릭하세요' : '—';
    el.classList.add('muted');
  });
  renderShapeList();
}

// ─────────────────────────────────────────────
// 10. 포맷 함수
// ─────────────────────────────────────────────
function formatArea(sqm) {
  return sqm >= 1000000
    ? (sqm / 1000000).toFixed(4) + ' km²'
    : Math.round(sqm).toLocaleString() + ' m²';
}

function formatLength(km) {
  return km >= 1
    ? km.toFixed(3) + ' km'
    : Math.round(km * 1000) + ' m';
}

// ─────────────────────────────────────────────
// 11. 지도 클릭 → VWorld 역지오코딩 (주소 조회)
// ─────────────────────────────────────────────
map.on('click', async function(e) {
  const { lat, lng } = e.latlng;

  // 좌표 즉시 표시
  setAddr('addrCoord', `${lat.toFixed(6)}, ${lng.toFixed(6)}`);
  setAddr('addrRoad',   '조회 중…');
  setAddr('addrJibun',  '조회 중…');
  setAddr('addrRegion', '조회 중…');
  setAddr('addrZip',    '조회 중…');

  try {
    // ── 도로명 주소
    const urlRoad = `https://api.vworld.kr/req/address?service=address&request=getAddress`
      + `&version=2.0&crs=epsg:4326&point=${lng},${lat}`
      + `&format=json&type=ROAD&zipcode=true&simple=false&key=${VWORLD_KEY}`;

    const resRoad = await fetch(urlRoad);
    const dataRoad = await resRoad.json();

    if (dataRoad.response?.result?.[0]) {
      const r = dataRoad.response.result[0];
      setAddr('addrRoad',  r.text  || '—');
      setAddr('addrZip',   r.zipcode || '—');
      const strAddr = r.structure;
      if (strAddr) {
        const region = [strAddr.level1, strAddr.level2, strAddr.level3]
          .filter(Boolean).join(' ');
        setAddr('addrRegion', region || '—');
      }
    } else {
      setAddr('addrRoad', '도로명 주소 없음');
      setAddr('addrZip',  '—');
    }

    // ── 지번 주소
    const urlParcel = `https://api.vworld.kr/req/address?service=address&request=getAddress`
      + `&version=2.0&crs=epsg:4326&point=${lng},${lat}`
      + `&format=json&type=PARCEL&zipcode=false&simple=false&key=${VWORLD_KEY}`;

    const resParcel = await fetch(urlParcel);
    const dataParcel = await resParcel.json();

    if (dataParcel.response?.result?.[0]) {
      setAddr('addrJibun', dataParcel.response.result[0].text || '—');
    } else {
      setAddr('addrJibun', '지번 주소 없음');
    }

  } catch (err) {
    console.error('주소 조회 오류:', err);
    ['addrRoad','addrJibun','addrRegion','addrZip'].forEach(id => setAddr(id, '조회 실패'));
  }
});

// 주소 텍스트 세팅 헬퍼
function setAddr(id, text) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.classList.toggle('muted', ['—','조회 중…','지도를 클릭하세요'].includes(text));
}
</script>
</body>
</html>
